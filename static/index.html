<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>imgsvc · 图像抠图服务</title>
<style>
  :root {
    --bg:#f7f7f8; --card:#fff; --line:#e5e5e8; --fg:#222; --muted:#8a8a90;
    --accent:#d64545; --ok:#2e7d32;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    line-height:1.65; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 44px 20px 64px; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 18px; margin-bottom: 26px; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.3px; }
  .sub { color: var(--muted); font-size: 14px; }

  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 24px; box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }

  #drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 34px 20px;
    text-align: center; cursor: pointer; transition: .15s ease; color: var(--muted);
  }
  #drop:hover, #drop.over { border-color: var(--accent); color: var(--accent); background: #fffafa; }
  #drop b { color: var(--fg); }
  #drop.over b { color: var(--accent); }

  .row { display:flex; gap:10px; align-items:center; margin-top:18px; flex-wrap:wrap; }
  button {
    background: var(--accent); color:#fff; border:0; border-radius:8px;
    padding:10px 20px; font-size:15px; cursor:pointer; transition:.15s;
    font-family: inherit;
  }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { background:#cfcfd4; cursor:not-allowed; }
  button.ghost { background:none; color:var(--muted); padding:10px 12px; }
  button.ghost:hover { color:var(--fg); }
  .status { font-size:14px; color:var(--muted); }
  .status.ok  { color: var(--ok); }
  .status.err { color: var(--accent); }

  .panes { display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-top:24px; }
  .pane h3 {
    font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.4px;
    text-transform:uppercase; margin:0 0 8px;
  }
  .pane h3 .hint {
    text-transform:none; letter-spacing:0; font-weight:400; font-size:11.5px;
    color:#b0b0b6; margin-left:4px;
  }
  .pane img {
    max-width:100%; border-radius:8px; display:block;
    background: repeating-conic-gradient(#ececef 0% 25%, #fff 0% 50%) 50% / 18px 18px;
  }
  .pane img:not([src]) { display:none; }
  .empty {
    color:#b9b9bf; font-size:13px; padding:40px 0; text-align:center;
    border:1px dashed var(--line); border-radius:8px;
  }

  /* ---------- 框选 ---------- */
  .cropbox { position: relative; display: inline-block; line-height: 0; }
  .cropbox canvas { display: none; }
  #src { cursor: crosshair; user-select: none; touch-action: none; }
  #sel {
    position: absolute; display: none; pointer-events: none; box-sizing: border-box;
    border: 2px dashed var(--accent);
    background: rgba(214,69,69,.14);
    box-shadow: 0 0 0 9999px rgba(0,0,0,.10);
  }

  footer { margin-top:26px; color:var(--muted); font-size:13px; }
  code {
    background:#f0f0f2; padding:1px 6px; border-radius:4px; font-size:12px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  @media (max-width: 720px) { .panes { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>imgsvc</h1>
    <div class="sub">图像抠图服务 · U²-Net + ONNX Runtime + 原生 socket</div>
  </header>

  <div class="card">
    <div id="drop">
      点击选择图片，或者把图片<b>拖到这里</b><br>
      <span style="font-size:13px">支持 JPG / PNG / WebP · 最大 10 MB</span>
    </div>
    <input type="file" id="file" accept="image/*" hidden>

    <div class="row">
      <button id="go" disabled>开始抠图</button>
      <button id="clearSel" class="ghost" hidden>清除选区</button>
      <button id="reset" class="ghost" hidden>清除图片</button>
      <span class="status" id="status"></span>
    </div>

    <div class="panes">
      <div class="pane">
        <h3>原图 <span class="hint">在图上拖拽可框选区域</span></h3>
        <div class="cropbox" id="cropbox">
          <img id="src" alt="">
          <div id="sel"></div>
        </div>
        <div class="empty" id="srcEmpty">还没有选择图片</div>
      </div>
      <div class="pane">
        <h3>抠图结果</h3>
        <img id="out" alt="">
        <div class="empty" id="outEmpty">结果会显示在这里</div>
      </div>
    </div>
  </div>

  <footer>
    后端接口：<code>GET /</code> 静态页面 · <code>POST /infer</code> 接收图片原始字节（可选请求头 <code>X-Crop: x,y,w,h</code>），返回透明背景 PNG
  </footer>

</div>

<script>
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };

  var fileInput = $('file'), drop = $('drop'), goBtn = $('go');
  var resetBtn = $('reset'), clearSelBtn = $('clearSel');
  var statusEl = $('status'), srcImg = $('src'), outImg = $('out');
  var srcEmpty = $('srcEmpty'), outEmpty = $('outEmpty');
  var cropbox = $('cropbox'), selBox = $('sel');

  var selected = null;
  var srcURL = null, outURL = null;
  var sel = null;               // {x, y, w, h} —— 原图坐标系
  var drag = null;              // 拖拽中的临时状态

  function setStatus(text, kind) {
    statusEl.textContent = text || '';
    statusEl.className = 'status' + (kind ? ' ' + kind : '');
  }

  function revoke() {
    if (srcURL) { URL.revokeObjectURL(srcURL); srcURL = null; }
    if (outURL) { URL.revokeObjectURL(outURL); outURL = null; }
  }

  function clearImages() {
    revoke();
    srcImg.removeAttribute('src');
    outImg.removeAttribute('src');
    srcEmpty.style.display = '';
    outEmpty.style.display = '';
    clearSel();
  }

  /* ---------------- 框选 ---------------- */

  function drawSel() {
    if (!sel || !srcImg.naturalWidth) { selBox.style.display = 'none'; return; }
    var rect = srcImg.getBoundingClientRect();
    var scaleX = rect.width  / srcImg.naturalWidth;
    var scaleY = rect.height / srcImg.naturalHeight;
    selBox.style.display = 'block';
    selBox.style.left   = (sel.x * scaleX) + 'px';
    selBox.style.top    = (sel.y * scaleY) + 'px';
    selBox.style.width  = (sel.w * scaleX) + 'px';
    selBox.style.height = (sel.h * scaleY) + 'px';
  }

  function clearSel() {
    sel = null;
    selBox.style.display = 'none';
    clearSelBtn.hidden = true;
    if (selected) setStatus('已选择 ' + selected.name);
  }

  function pointToImage(e) {
    var rect = srcImg.getBoundingClientRect();
    var scaleX = srcImg.naturalWidth  / rect.width;
    var scaleY = srcImg.naturalHeight / rect.height;
    var x = (e.clientX - rect.left) * scaleX;
    var y = (e.clientY - rect.top)  * scaleY;
    x = Math.max(0, Math.min(x, srcImg.naturalWidth));
    y = Math.max(0, Math.min(y, srcImg.naturalHeight));
    return { x: x, y: y };
  }

  srcImg.addEventListener('pointerdown', function (e) {
    if (!srcImg.naturalWidth) return;
    e.preventDefault();
    srcImg.setPointerCapture(e.pointerId);
    var p = pointToImage(e);
    drag = { x0: p.x, y0: p.y };
    sel = { x: p.x, y: p.y, w: 0, h: 0 };
  });

  srcImg.addEventListener('pointermove', function (e) {
    if (!drag) return;
    e.preventDefault();
    var p = pointToImage(e);
    sel.x = Math.min(drag.x0, p.x);
    sel.y = Math.min(drag.y0, p.y);
    sel.w = Math.abs(p.x - drag.x0);
    sel.h = Math.abs(p.y - drag.y0);
    drawSel();
  });

  function endDrag(e) {
    if (!drag) return;
    try { srcImg.releasePointerCapture(e.pointerId); } catch (err) {}
    drag = null;

    // 太小的选区当作没选（8x8 是后端的最小值）
    if (!sel || sel.w < 8 || sel.h < 8) {
      sel = null;
      selBox.style.display = 'none';
      clearSelBtn.hidden = true;
      setStatus('选区太小，已忽略（会抠全图）');
      return;
    }

    clearSelBtn.hidden = false;
    setStatus('选区 ' + Math.round(sel.w) + '×' + Math.round(sel.h) +
              ' @ (' + Math.round(sel.x) + ',' + Math.round(sel.y) + ')');
  }

  srcImg.addEventListener('pointerup', endDrag);
  srcImg.addEventListener('pointercancel', endDrag);

  clearSelBtn.addEventListener('click', clearSel);

  window.addEventListener('resize', function () { if (sel) drawSel(); });

  /* ---------------- 选择文件 ---------------- */

  function selectFile(f) {
    if (!f) return;
    if (f.type.indexOf('image/') !== 0) {
      setStatus('请选择图片文件', 'err');
      return;
    }
    clearImages();
    selected = f;
    srcURL = URL.createObjectURL(f);
    srcImg.onload = function () {
      srcEmpty.style.display = 'none';
      clearSel();
      setStatus('已选择 ' + f.name);
    };
    srcImg.src = srcURL;
    goBtn.disabled = false;
    resetBtn.hidden = false;
  }

  drop.addEventListener('click', function () { fileInput.click(); });
  fileInput.addEventListener('change', function (e) { selectFile(e.target.files[0]); });

  ['dragenter', 'dragover'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); });
  });
  drop.addEventListener('drop', function (e) {
    var fs = e.dataTransfer && e.dataTransfer.files;
    if (fs && fs[0]) selectFile(fs[0]);
  });

  /* ---------------- 推理 ---------------- */

  goBtn.addEventListener('click', function () {
    if (!selected) return;

    goBtn.disabled = true;
    goBtn.textContent = '推理中…';
    setStatus('推理中…');

    var t0 = performance.now();
    var headers = {};
    if (sel && sel.w >= 8 && sel.h >= 8) {
      headers['X-Crop'] = Math.round(sel.x) + ',' + Math.round(sel.y) + ',' +
                          Math.round(sel.w) + ',' + Math.round(sel.h);
    }

    fetch('/infer', { method: 'POST', body: selected, headers: headers })
      .then(function (resp) {
        if (!resp.ok) {
          return resp.text().then(function (t) {
            throw new Error('HTTP ' + resp.status + (t ? '：' + t : ''));
          });
        }
        return resp.blob();
      })
      .then(function (blob) {
        var ms = Math.round(performance.now() - t0);
        if (outURL) URL.revokeObjectURL(outURL);
        outURL = URL.createObjectURL(blob);
        outImg.onload = function () {
          outEmpty.style.display = 'none';
          setStatus('完成 · 往返 ' + ms + ' ms · 结果 ' +
                    (blob.size / 1024).toFixed(0) + ' KB', 'ok');
        };
        outImg.src = outURL;
      })
      .catch(function (err) {
        setStatus('失败：' + err.message, 'err');
      })
      .then(function () {
        goBtn.disabled = !selected;
        goBtn.textContent = '开始抠图';
      });
  });

  /* ---------------- 清除 ---------------- */

  resetBtn.addEventListener('click', function () {
    clearImages();
    selected = null;
    fileInput.value = '';
    goBtn.disabled = true;
    resetBtn.hidden = true;
    setStatus('');
  });
})();
</script>
</body>
</html>
